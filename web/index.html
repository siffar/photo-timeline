<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0e0d; --bg2:#171715; --bg3:#22221f; --bg4:#2c2c28; --line:#2c2c28;
  --tx:#ecebe6; --tx2:#a3a199; --tx3:#6d6b64;
  --acc:#e8b04a; --acc-tx:#1a1408; --warn:#e07a5f; --ok:#7fb77e;
  --serif:"Fraunces", Georgia, serif;
  --sans:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
.sp{flex:1}
.muted{color:var(--tx2)}
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;color:var(--tx)}
.btn:hover{background:var(--bg4)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-tx);font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.pri:disabled{opacity:.45;cursor:default;filter:none}
.btn.ghost{background:none;border-color:transparent;color:var(--tx2)}
.btn.ghost:hover{color:var(--tx);background:var(--bg3)}
.btn.danger{color:var(--warn)}
.btn.sm{padding:4px 9px;font-size:12.5px}

/* ── header ── */
/* layout: sidebar on laptops, bottom tabs on phones (no blur effects — cheap to scroll) */
:root{--sw:212px;--bh:0px}
@media (max-width:860px){:root{--sw:0px;--bh:62px}}
header,main{margin-left:var(--sw)}
main{padding-bottom:var(--bh)}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
#side{position:fixed;left:0;top:0;bottom:0;width:var(--sw);background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 16px;z-index:25}
#side .brand{padding:2px 10px 18px}
#tabs{display:flex;flex-direction:column;gap:2px}
#tabs button{display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--tx2);padding:8px 10px;border-radius:9px;cursor:pointer;text-align:left;font-weight:500}
#tabs button:hover{background:var(--bg3);color:var(--tx)}
#tabs button.on{background:var(--bg3);color:var(--tx)}
#tabs button.on svg{color:var(--acc)}
#tabs .n{margin-left:auto;font-size:11.5px;color:var(--tx3);font-weight:500}
.navsep{height:1px;background:var(--line);margin:10px 8px}
#side #addBtn{width:100%;justify-content:center}
#bnav{display:none}
.brand.mob{display:none}
@media (max-width:860px){
  #side{display:none}
  body.nofilters .brand.mob{display:block;font-size:19px}
  #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;height:var(--bh);background:var(--bg2);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
  #bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;color:var(--tx3);font-size:11px;font-weight:500;cursor:pointer}
  #bnav button.on{color:var(--acc)}
}
.search{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:0 10px;color:var(--tx3);flex:1;min-width:0}
.search:focus-within{border-color:var(--tx3)}
.search input{background:none;border:0;outline:none;padding:8px 0;width:100%;min-width:0}
.fwrap{position:relative}
#fBtn{display:inline-flex;align-items:center;gap:7px}
.fcount{background:var(--acc);color:var(--acc-tx);border-radius:999px;font-size:11px;font-weight:700;padding:0 6px;line-height:17px}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:260px;background:var(--bg2);border:1px solid var(--bg4);border-radius:12px;padding:14px;box-shadow:0 16px 40px rgba(0,0,0,.5);z-index:30}
.pop .field{margin:0 0 12px}
.pop select{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:7px 9px;outline:none}
.hrow{display:flex;align-items:center;gap:14px;padding:11px 20px;flex-wrap:wrap}
.brand{font:600 22px/1 var(--serif);letter-spacing:-.01em;white-space:nowrap}
.brand small{font:500 12px var(--sans);color:var(--tx3);margin-left:8px;letter-spacing:0}

.filters{display:flex;gap:8px;align-items:center;flex:1;max-width:560px;min-width:0}
#count{color:var(--tx3);white-space:nowrap}
#pill{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:12.5px;position:relative;overflow:hidden;max-width:360px}
#pill .pt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
#pill .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--acc);transition:width .4s}
#pill .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none;animation:pulse 1.2s infinite}
#pill button{background:var(--bg3);border:0;border-radius:999px;padding:3px 9px;cursor:pointer;font-size:12px;color:var(--tx2)}
@keyframes pulse{50%{opacity:.3}}
@media (max-width:860px){
  .hrow{padding:9px 14px;gap:10px}
  #count{display:none}
  .filters{order:3;flex-basis:100%;max-width:none}
  #fBtn .lbl{display:none}
  #pill{max-width:58vw}
}

/* ── grids ── */
#tl{padding:8px 64px 120px 20px}
@media (max-width:860px){#tl{padding:4px 14px 120px}}
.month h2{font:600 26px/1.1 var(--serif);letter-spacing:-.015em;margin:34px 0 4px;display:flex;align-items:baseline;gap:10px}
.month h2 span{font:500 12px var(--sans);color:var(--tx3)}
.mbody,.jbody{position:relative}
.day{position:absolute;left:0;font-size:12.5px;color:var(--tx2);font-weight:500;line-height:28px;display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.dchk{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--tx3);opacity:0;transition:opacity .15s;flex:none;position:relative}
.day:hover .dchk,body.selecting .dchk{opacity:1}
.day.allsel .dchk{background:var(--acc);border-color:var(--acc)}
.cell{position:absolute;display:block;overflow:hidden;background:var(--bg3);border-radius:3px;cursor:zoom-in;-webkit-tap-highlight-color:transparent}
.cell img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease,border-radius .2s}
.cell:hover img{transform:scale(1.035)}
.cell.noimg::after{content:"no preview";position:absolute;inset:0;display:grid;place-items:center;color:var(--tx3);font-size:11px}
.cell.noimg img{opacity:0}
.badge{position:absolute;right:6px;bottom:6px;font:600 10.5px var(--sans);letter-spacing:.02em;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:4px;color:#fff;pointer-events:none}
.heart{position:absolute;right:7px;top:5px;color:#fff;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.7);pointer-events:none}
.chk{position:absolute;left:7px;top:7px;width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.92);background:rgba(0,0,0,.25);
  opacity:0;transition:opacity .15s;cursor:pointer;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.cell:hover .chk,body.selecting .cell .chk{opacity:1}
.cell.sel{background:color-mix(in srgb,var(--acc) 22%,var(--bg2))}
.cell.sel img,.cell.sel:hover img{transform:scale(.86);border-radius:5px}
.cell.sel .chk,.day.allsel .dchk{background:var(--acc);border-color:var(--acc)}
.cell.sel .chk::after,.day.allsel .dchk::after{content:"";position:absolute;left:5.5px;top:1.5px;width:5px;height:10px;border:solid var(--acc-tx);border-width:0 2px 2px 0;transform:rotate(45deg)}
.day.allsel .dchk::after{left:4px;top:.5px;width:4px;height:8px}
body.selecting .cell{cursor:pointer}
.empty{color:var(--tx2);padding:60px 0;text-align:center;font-size:15px}

/* scrubber */
#scrub{position:fixed;right:0;top:var(--hh,64px);bottom:0;width:56px;display:flex;flex-direction:column;justify-content:space-between;padding:14px 0 18px;z-index:10;user-select:none}
#scrub button{background:none;border:0;color:var(--tx3);font:500 11px var(--sans);cursor:pointer;padding:2px 14px 2px 0;text-align:right}
#scrub button:hover,#scrub button.on{color:var(--tx)}
#scrub button.on::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--acc);margin-left:5px;vertical-align:1px}
#bubble{position:fixed;right:64px;z-index:11;background:var(--bg3);border:1px solid var(--line);padding:5px 10px;border-radius:8px;font-weight:500;font-size:12.5px;pointer-events:none;opacity:0;transition:opacity .25s}
@media (max-width:860px){#scrub,#bubble{display:none}}

/* ── panes ── */
.pane{padding:24px 20px 120px;max-width:1600px}
.pane h1{font:600 30px/1.1 var(--serif);letter-spacing:-.015em;margin:8px 0 6px}
.pane .lede{color:var(--tx2);margin:0 0 24px;max-width:740px}
.pane h3{font:600 19px var(--serif);margin:28px 0 10px;display:flex;align-items:baseline;gap:8px}
.pane h3 small{font:500 12.5px var(--sans);color:var(--tx3)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}
.tiles .cell{position:relative;aspect-ratio:1}
.dgroup{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.dgroup .cell{position:relative;aspect-ratio:1}
.dgroup ul{list-style:none;margin:0;padding:0;font-size:12.5px;color:var(--tx2);min-width:0}
.dgroup li{padding:3px 0;overflow-wrap:anywhere}
.dgroup li b{color:var(--tx);font-weight:500}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;margin-right:6px;background:var(--bg3);color:var(--tx2);letter-spacing:.02em}
.tag.acc{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc)}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:0 0 20px}
.stat b{display:block;font:600 26px var(--serif)}
.stat span{color:var(--tx2);font-size:12.5px}
#map{position:fixed;left:var(--sw);right:0;bottom:var(--bh);top:var(--hh,64px)}
.pin{border-radius:50%;overflow:hidden;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5);background:#333}
.pin img{width:100%;height:100%;object-fit:cover;display:block}
.mapmsg{position:fixed;inset:var(--hh,64px) 0 var(--bh) var(--sw);display:grid;place-items:center;color:var(--tx2)}

/* welcome */
.welcome{min-height:calc(100vh - 140px);display:grid;place-items:center;text-align:center;padding:40px 20px}
.welcome h1{font:600 clamp(34px,5vw,56px)/1.05 var(--serif);letter-spacing:-.02em;margin:0 0 14px}
.welcome p{color:var(--tx2);max-width:540px;margin:0 auto 28px;font-size:15.5px}
.welcome .btn{font-size:15px;padding:12px 22px}
.welcome ul{list-style:none;padding:0;margin:34px auto 0;display:flex;gap:26px;justify-content:center;flex-wrap:wrap;color:var(--tx3);font-size:13px}

/* albums */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px 16px}
@media (max-width:600px){.agrid{grid-template-columns:repeat(2,1fr);gap:16px 10px}.acard h4{font-size:13.5px}.pane{padding:16px 14px 120px}.pane h1{font-size:25px}}
.acard{cursor:pointer;min-width:0}
.acard .cov{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg3);position:relative}
.acard .cov img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.acard:hover .cov img{transform:scale(1.04)}
.acard .cov.new{display:grid;place-items:center;border:1.5px dashed var(--bg4);background:none;color:var(--tx2);font-size:13px;text-align:center;padding:20px}
.acard .cov.new b{display:block;font:600 34px/1 var(--serif);color:var(--tx);margin-bottom:6px}
.acard h4{margin:9px 0 1px;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard p{margin:0;color:var(--tx3);font-size:12.5px}
.acard .cov .tag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6);color:#fff}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--tx2);margin:10px 0 2px}
.crumbs a{color:var(--tx2);text-decoration:none;padding:2px 6px;border-radius:6px;margin:0 -6px}
.crumbs a:hover{color:var(--tx);background:var(--bg3)}
.crumbs span:last-child{color:var(--tx)}
.crumbs .sep{color:var(--tx3)}
.acard:focus-visible{outline:2px solid var(--acc);outline-offset:4px;border-radius:12px}
.ahead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.ahead h1{margin:0;cursor:text}
.ahead .acts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}

/* selection bar */
#selbar{position:fixed;left:calc(50% + var(--sw) / 2);bottom:calc(var(--bh) + 16px);transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:6px;
  background:var(--bg2);border:1px solid var(--bg4);border-radius:14px;padding:7px;box-shadow:0 12px 40px rgba(0,0,0,.55);max-width:calc(100vw - 24px);overflow-x:auto}
#selbar .cnt{font-weight:600;padding:0 10px 0 4px;white-space:nowrap}
#selbar .btn{border-color:transparent}
@media (max-width:600px){#selbar .lbl{display:none}}

/* modals */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--bg2);border:1px solid var(--bg4);border-radius:16px;width:min(520px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal.wide{width:min(780px,100%)}
.mbody2{padding:22px 24px;overflow-y:auto}
.modal h2{font:600 24px/1.15 var(--serif);margin:0 0 6px;letter-spacing:-.01em}
.modal h4{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3);margin:22px 0 10px;font-weight:600}
.modal .lede{color:var(--tx2);margin:0 0 6px}
.mfoot{display:flex;align-items:center;gap:8px;padding:14px 24px;border-top:1px solid var(--line);flex-wrap:wrap}
.mfoot .note{color:var(--tx3);font-size:12px;flex:1;min-width:180px}
.setup h4{margin-top:22px}
.ov ~ #toasts,body:has(.ov) #toasts{top:20px;bottom:auto}
.slist{border:1px solid var(--line);border-radius:12px;padding:0 14px}
.slist .srow{gap:12px}
.slist .srow small{display:block}
.srow.fading{opacity:.5}
.sic{font-size:20px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.busy{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.confirm{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tx2);white-space:nowrap}
.btn.danger-solid{background:var(--warn);border-color:var(--warn);color:#1a0d08;font-weight:600}
.small{font-size:12.5px;margin:8px 2px 0}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.sjob{display:flex;gap:12px;align-items:center;background:var(--bg3);border-radius:12px;padding:12px 14px;margin:14px 0 4px;color:var(--acc)}
.sjob b{color:var(--tx);font-weight:600;display:block}
.sjob small{display:block;color:var(--tx3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar{height:4px;background:var(--bg4);border-radius:2px;margin-top:8px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--acc);transition:width .5s}
button.dcard{font:inherit;color:inherit;text-align:left;width:100%}
.dcard .dtxt{min-width:0;flex:1;display:block}
.dcard.added{cursor:default;background:color-mix(in srgb,var(--ok) 8%,var(--bg3));border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.dcard.added .box{background:var(--ok);border-color:var(--ok)}
.dcard .okt{color:var(--ok)!important;font-weight:500}
.dcard .acct{color:var(--acc)!important;font-weight:500}
.dcard.pickother{border:1.5px dashed var(--bg4);background:none;align-items:center}
.dcard.pickother .ic{font-size:20px;color:var(--tx2)}
@media (max-width:600px){.slist .srow{flex-wrap:wrap}.confirm{white-space:normal;flex-wrap:wrap}}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.dcard{display:flex;gap:11px;align-items:flex-start;background:var(--bg3);border:1.5px solid transparent;border-radius:12px;padding:12px;cursor:pointer;user-select:none}
.dcard:hover{border-color:var(--bg4)}
.dcard.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--bg3))}
.dcard.dis{opacity:.55;cursor:default}
.dcard .ic{font-size:22px;line-height:1}
.dcard b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard small{display:block;color:var(--tx2);font-size:12px;overflow-wrap:anywhere}
.dcard .use{height:4px;background:var(--bg4);border-radius:2px;margin-top:7px;overflow:hidden}
.dcard .use i{display:block;height:100%;background:var(--tx3)}
.dcard .box{margin-left:auto;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--tx3);flex:none;position:relative}
.dcard.on .box{background:var(--acc);border-color:var(--acc)}
.dcard.on .box::after,.dcard.added .box::after{content:"";position:absolute;left:5px;top:1.5px;width:4px;height:9px;border:solid var(--acc-tx);border-width:0 2px 2px 0;transform:rotate(45deg)}
.srow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow div{min-width:0;flex:1}
.srow b{font-weight:500}
.srow small{display:block;color:var(--tx3);font-size:12px;overflow-wrap:anywhere}
.flist{border:1px solid var(--line);border-radius:10px;max-height:340px;overflow-y:auto;margin-top:10px}
.flist button{display:flex;width:100%;text-align:left;gap:10px;background:none;border:0;border-top:1px solid var(--line);padding:9px 12px;cursor:pointer}
.flist button:first-child{border-top:0}
.flist button:hover{background:var(--bg3)}
.fpath{font-size:12.5px;color:var(--tx2);overflow-wrap:anywhere;display:flex;gap:8px;align-items:center}
.pathin{flex:1;background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:6px 8px;outline:none;font:12.5px ui-monospace,Consolas,monospace;color:var(--tx);min-width:0}
.fpath code{background:var(--bg3);padding:4px 8px;border-radius:6px;color:var(--tx);flex:1}
.field{display:block;margin:14px 0 0}
.field span{display:block;font-size:12px;color:var(--tx2);margin-bottom:5px}
.field input[type=text]{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none}
.field input[type=text]:focus{border-color:var(--tx3)}
.chkrow{display:flex;gap:9px;align-items:flex-start;margin-top:14px;cursor:pointer;color:var(--tx2)}
.chkrow input{margin-top:3px;accent-color:var(--acc)}
.opt{display:flex;gap:11px;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin-top:10px;cursor:pointer}
.opt.on{border-color:var(--acc)}
.opt input{accent-color:var(--acc);margin-top:3px}
.opt b{display:block}
.opt small{color:var(--tx2)}
.alist button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:8px;border-radius:10px;cursor:pointer;text-align:left}
.alist button:hover{background:var(--bg3)}
.alist img,.alist .ph{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--bg4);flex:none}
.share-url{display:flex;gap:8px;align-items:center;background:var(--bg3);border-radius:10px;padding:10px 12px;margin:16px 0 4px;font-weight:500;overflow-wrap:anywhere}
.share-url span{flex:1}
#qr{display:grid;place-items:center;margin:14px 0}
#qr img{background:#fff;border-radius:12px;width:200px;height:200px}

/* toast */
#toasts{position:fixed;right:20px;bottom:calc(var(--bh) + 20px);z-index:70;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 40px))}
body.selecting #toasts{bottom:calc(var(--bh) + 86px)}
.toast{background:var(--bg3);border:1px solid var(--bg4);border-radius:12px;padding:12px 14px;box-shadow:0 12px 36px rgba(0,0,0,.5);animation:fade .2s}
.toast .acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.toast.err{border-color:var(--warn)}

/* ── lightbox ── */
#lb{position:fixed;inset:0;z-index:50;background:#000;display:flex}
.lb-stage{position:relative;flex:1;overflow:hidden;touch-action:pan-y;display:grid;place-items:center}
.lb-stage img,.lb-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#lbImg{animation:fadein .35s ease}
.lbsel{appearance:none;-webkit-appearance:none;padding:0 12px;outline:none;font-weight:500}
.lbsel option{color:#000}
@keyframes fadein{from{opacity:.25}}
#lbMsg{position:relative;z-index:1;background:rgba(0,0,0,.75);border-radius:10px;color:var(--tx2);text-align:center;max-width:420px;padding:16px 20px}
.lb-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:14px 16px;background:linear-gradient(rgba(0,0,0,.65),transparent);z-index:2}
.lb-top .d{font-weight:500;min-width:0}
.lb-acts{display:flex;gap:8px;align-items:center}
.lb-top .d small{display:block;color:var(--tx2);font-size:12px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbb{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:999px;height:36px;min-width:36px;padding:0 12px;cursor:pointer;font-size:14px;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.lbb:hover{background:rgba(255,255,255,.2)}
.lbb.on{background:var(--acc);color:var(--acc-tx)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;font-size:26px;width:46px;height:46px;padding:0}
.lb-prev{left:14px}.lb-next{right:14px}
#lbInfo{width:360px;background:var(--bg2);border-left:1px solid var(--line);overflow-y:auto;padding:16px 20px 40px;flex:none;animation:islide .2s ease-out}
@keyframes islide{from{transform:translateX(24px);opacity:.4}}
.ihead{display:flex;align-items:center;margin:0 0 6px}
.ihead h4{font:600 21px var(--serif);margin:0;flex:1}
.lbb.ix{background:var(--bg3);width:32px;height:32px;min-width:32px;padding:0;font-size:13px}
.iload{display:grid;place-items:center;padding:40px;color:var(--tx3)}
.icap{font-size:15px;line-height:1.5;margin:10px 0 4px}
.isec{border-top:1px solid var(--line);padding:14px 0 2px}
.isec:first-of-type{border-top:0}
.irow{display:flex;gap:13px;margin-bottom:12px}
.iic{color:var(--tx3);flex:none;margin-top:1px;display:inline-flex}
.itx{min-width:0;flex:1}
.imain{font-weight:500;overflow-wrap:anywhere}
.isub{color:var(--tx2);font-size:13px;margin-top:1px;overflow-wrap:anywhere}
.ifaint{color:var(--tx3);font-size:12px;margin-top:4px}
.iwarn{color:var(--warn);font-size:12.5px;margin-top:5px;line-height:1.4}
.ilinks{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:5px;font-size:12.5px}
.ilinks a{color:var(--acc);text-decoration:none}
.ilinks a:hover{text-decoration:underline}
.ichips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ichips span,.ichips a{background:var(--bg3);border-radius:7px;padding:3px 9px;font-size:12.5px;color:var(--tx);text-decoration:none}
.ichips.links a:hover{background:var(--bg4)}
.ivtext{color:var(--tx2);font-size:12.5px;margin-top:8px;font-style:italic;overflow-wrap:anywhere}
.hero{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:24px 26px;max-width:640px;margin-top:10px}
.hero h3{font:600 22px var(--serif);margin:0 0 8px}
.hero p{color:var(--tx2);margin:0 0 12px}
.hero ul{color:var(--tx2);margin:0 0 20px;padding-left:18px;font-size:13.5px}
.hero li{margin:4px 0}
.ipath{color:var(--tx3);font-size:12px;margin-top:5px;overflow-wrap:anywhere}
.ibtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ibtns .btn{text-decoration:none}
.icopies summary{cursor:pointer;display:flex;gap:13px;align-items:center;color:var(--tx2);font-size:13px;list-style:none;margin-bottom:10px}
.icopies summary::-webkit-details-marker{display:none}
.icopy{font-size:12px;color:var(--tx3);overflow-wrap:anywhere;margin:0 0 8px 30px}
#lbInfoBtn{gap:2px}
@media (max-width:860px){
  #lb{flex-direction:column}
  #lbInfo{width:auto;max-height:58vh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;margin-top:-18px;position:relative;z-index:4;animation:isheet .22s ease-out;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
  #lbInfo::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--bg4);margin:0 auto 10px}
  @keyframes isheet{from{transform:translateY(40px);opacity:.4}}
  .lb-nav{display:none}
  .lbb .lbl{display:none}
  .lb-top .d{flex:1}
  .lb-top .sp{display:none}
  .lb-acts{position:fixed;left:0;right:0;bottom:0;justify-content:space-around;padding:12px 10px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.75));z-index:3}
  #lb.info .lb-acts{position:static;background:none;padding:0}
}
</style>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DS = {
  "exif": ["Camera / phone metadata (EXIF)", false],
  "quicktime": ["iPhone video metadata", false],
  "takeout": ["Google Photos metadata (Takeout .json)", false],
  "filename": ["Read from the file name", false],
  "video-meta": ["Video metadata", false],
  "exif-modified": ["EXIF ‘modified’ date — could be when it was edited", true],
  "file-time": ["File’s modified time — often the download date, so probably wrong", true],
};
const S = { all: [], list: [], byId: new Map(), sources: [], cams: [], months: [], newest: true, view: "timeline",
            stats: {}, sel: new Set(), lastSel: null, albums: [], album: null, ready: false };
const GAP = 4;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const N = n => (n || 0).toLocaleString();
const fmtBytes = n => n >= 1e12 ? (n / 1e12).toFixed(1) + " TB" : n >= 1e9 ? (n / 1e9).toFixed(1) + " GB" : n >= 1e6 ? (n / 1e6).toFixed(1) + " MB" : Math.round((n || 0) / 1e3) + " KB";
const fmtDur = s => s ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}` : "";
const fmtEta = s => s < 90 ? "1 min" : s < 3600 ? Math.round(s / 60) + " min" : (s / 3600).toFixed(1) + " h";
const parts = t => [+t.slice(0, 4), +t.slice(5, 7), +t.slice(8, 10)];
function dayLabel(key, withYear) {
  const [y, m, d] = parts(key); const dt = new Date(y, m - 1, d);
  return `${DAYS[dt.getDay()]}, ${d} ${MONTHS[m - 1].slice(0, 3)}${withYear ? " " + y : ""}`;
}
function fullDate(t) {
  const [y, m, d] = parts(t); const dt = new Date(y, m - 1, d);
  return `${DAYS[dt.getDay()]}, ${d} ${MONTHS[m - 1]} ${y}` + (t.length > 10 ? ` · ${t.slice(11, 16)}` : "");
}
function span(a, b) {
  if (!a) return "";
  const [y1, m1] = parts(a), [y2, m2] = parts(b);
  if (y1 === y2 && m1 === m2) return `${MONTHS[m1 - 1].slice(0, 3)} ${y1}`;
  if (y1 === y2) return `${MONTHS[m1 - 1].slice(0, 3)} – ${MONTHS[m2 - 1].slice(0, 3)} ${y1}`;
  return `${y1} – ${y2}`;
}
async function get(u) { const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.json(); }
async function post(u, b = {}) {
  const r = await fetch(u, { method: "POST", headers: { "Content-Type": "application/json", "X-Timeline": "1" }, body: JSON.stringify(b) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(j.error || r.status);
  return j;
}

/* ───────── toast ───────── */
function toast(html, acts = [], { err = false, ms } = {}) {
  const t = document.createElement("div"); t.className = "toast" + (err ? " err" : "");
  t.innerHTML = `<div>${html}</div>` + (acts.length ? `<div class="acts">${acts.map((a, i) => `<button class="btn sm" data-i="${i}">${esc(a[0])}</button>`).join("")}<button class="btn sm ghost" data-x>Dismiss</button></div>` : "");
  t.onclick = e => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.i) acts[+b.dataset.i][1](); t.remove(); };
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), ms || (acts.length ? 15000 : 5000));
}
const reveal = body => post("/api/reveal", body).catch(() => {});

/* ───────── load & filter ───────── */
async function load() {
  let d;
  try { d = await get("/api/media"); }
  catch { $("#tl").innerHTML = `<p class="empty">Can’t reach Photo Timeline. Is its window still open?</p>`; return; }
  S.sources = d.sources; S.cams = d.cameras; S.stats = d.stats; S.places = d.places || [];
  S.all = d.items.map(a => ({ id: a[0], t: a[1], k: a[2], w: a[3] || 4, h: a[4] || 3, src: a[5], cam: a[6], lat: a[7], lon: a[8], ds: a[9],
                              live: a[10], dur: a[11], name: a[12], fav: a[13], txt: a[14], pl: a[15], tags: a[16], faces: a[17], vtext: a[18] }));
  S.syn = d.synonyms || {};
  S.byId = new Map(S.all.map(it => [it.id, it]));
  for (const id of [...S.sel]) if (!S.byId.has(id)) S.sel.delete(id);
  fillSelect("#fSource", "All folders", S.sources, "src");
  fillSelect("#fCam", "All cameras", S.cams, "cam");
  const nd = (S.stats.exact || 0) + (S.stats.similar || 0);
  $("#nDup").textContent = nd ? N(nd) : "";
  S.ready = true;
  $("#nThing").textContent = (n => n ? N(n) : "")(S.all.filter(i => i.tags || i.faces).length);
  loadAlbums();
  applyFilters();
}
async function loadAlbums() {
  try { S.albums = await get("/api/albums"); } catch { S.albums = []; }

/* ───────── layout (justified rows) ───────── */

    const ar = Math.min(Math.max(it.w / it.h, 0.45), 3.2);
    row.push([it, ar]); sum += ar;

  }

}

  if (ctx) a._ctx = ctx;

  img.onerror = () => a.classList.add("noimg");

    + (it.k === "v" ? `<span class="badge">▶ ${fmtDur(it.dur)}</span>` : it.live ? `<span class="badge">LIVE</span>` : ""));

let io;
function renderTimeline() {

  const months = []; let cm = null, cd = null;
  for (const it of S.list) {
    const mk = it.t.slice(0, 7), dk = it.t.slice(0, 10);
    if (!cm || cm.key !== mk) { cm = { key: mk, days: [], n: 0 }; months.push(cm); cd = null; }
    if (!cd || cd.key !== dk) { cd = { key: dk, items: [] }; cm.days.push(cd); }
    cd.items.push(it); cm.n++;

  S.months = months;
  if (!months.length) { tl.innerHTML = `<p class="empty">Nothing matches these filters.</p>`; $("#scrub").innerHTML = ""; return; }
  io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? paint(e.target._m) : unpaint(e.target._m)), { rootMargin: "1800px 0px" });

    const [y, mo] = parts(m.key);

  cluster = L.markerClusterGroup({ maxClusterRadius: 50, showCoverageOnHover: false });
  for (const it of geo) {
    const m = L.marker([it.lat, it.lon], { icon: L.divIcon({ className: "pin", html: `<img src="/thumb/${it.id}" loading="lazy" alt="">`, iconSize: [46, 46] }) });
    m.on("click", () => openLB(geo, geo.indexOf(it))); cluster.addLayer(m);
  }
  map.addLayer(cluster);
  setTimeout(() => { map.invalidateSize(); map.fitBounds(cluster.getBounds(), { padding: [40, 40], maxZoom: 14 }); }, 30);
}

async function drawRoute(box, items) {

  routeMap = L.map(box, { scrollWheelZoom: false });

    .on("click", () => openLB(items, items.indexOf(it))).addTo(routeMap));
  routeMap.fitBounds(L.latLngBounds(line), { padding: [30, 30], maxZoom: 13 });
}

function thingsGroups(items) {

/* ───────── places: country → state → city ───────── */
const PLEVEL = [2, 1, 0];   // place tuple index for country, state, city
function placeGroups(items, sel) {
  const here = items.filter(it => { const p = S.places[it.pl]; return sel.every((v, k) => p[PLEVEL[k]] === v); });
  const groups = new Map();
  if (sel.length < 3) for (const it of here) { const k = S.places[it.pl][PLEVEL[sel.length]]; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(it); }
  return { here, groups: [...groups].sort((a, b) => b[1].length - a[1].length) };
}
/** The first level worth showing: skip “All places → India” when India is the only country, etc. */
function placeTop(items) {
  let sel = [];
  while (sel.length < 2) { const g = placeGroups(items, sel).groups; if (g.length !== 1) break; sel = sel.concat([g[0][0]]); }
  return sel;
}
function renderPlaces() {
  const el = $("#v-places");
  const items = S.list.filter(i => i.pl != null);
  if (!items.length) { el.innerHTML = `<h1>Places</h1><p class="empty">No place names yet. They’re added during a scan for photos with GPS (the one-time download of the place list needs internet).</p>`; return; }
  const top = placeTop(items);
  let sel = S.placeSel || [];
  if (sel.length < top.length) { sel = top; S.placeSel = sel; history.replaceState({ ...history.state, p: sel }, "", navHash({ v: "places", p: sel })); NAV.cur = navKey({ v: "places", a: null, p: sel }); }
  const level = sel.length;               // 0 countries · 1 states · 2 cities · 3 photos
  const { here, groups } = placeGroups(items, sel);
  if (!here.length && level) { S.placeSel = []; return renderPlaces(); }
  const atTop = level <= top.length;
  const crumbs = (top.length ? [] : [[0, "All places"]]).concat(sel.map((v, k) => [k + 1, v || "Unknown"]))
    .map(([l, t], k, arr) => k === arr.length - 1 ? `<span>${esc(t)}</span>` : `<a href="#" data-l="${l}">${esc(t)}</a>`).join(`<span class="sep">›</span>`);
  const kinds = ["countries", "states", "places"];
  el.innerHTML = `${atTop ? "" : `<button class="btn sm" id="pBack" title="Back (Backspace)">‹ Back</button>`}
    <div class="crumbs">${crumbs}</div>
    <h1>${esc(sel[level - 1] || "Places")}</h1>
    <p class="lede">${N(here.length)} photos &amp; videos${level < 3 ? ` in ${groups.length} ${groups.length === 1 ? kinds[level].replace(/ies$/, "y").replace(/s$/, "") : kinds[level]}` : ` · ${span(here[here.length - 1].t, here[0].t)}`}</p>`;
  const toLevel = l => go({ v: "places", p: sel.slice(0, l) });
  $$(".crumbs a", el).forEach(a => a.onclick = e => { e.preventDefault(); toLevel(+a.dataset.l); });
  if ($("#pBack", el)) $("#pBack", el).onclick = () => goUp({ v: "places", p: sel.slice(0, -1) });
  if (level === 3) {
    const by = new Map(); for (const it of here) { const y = it.t.slice(0, 4); if (!by.has(y)) by.set(y, []); by.get(y).push(it); }
    for (const [y, arr] of by) group(el, y, N(arr.length), arr, here);
    return;
  }
  const sub = arr => { if (level === 2) return span(arr[arr.length - 1].t, arr[0].t);
    const n = new Set(arr.map(it => S.places[it.pl][PLEVEL[level + 1]])).size; return `${n} ${level === 0 ? (n === 1 ? "state" : "states") : (n === 1 ? "place" : "places")}`; };
  el.insertAdjacentHTML("beforeend", `<div class="agrid">${groups.map(([k, arr], i) => {
    const cover = arr.find(x => x.fav && x.k === "p") || arr.find(x => x.k === "p") || arr[0];
    return `<div class="acard" data-i="${i}" tabindex="0"><div class="cov"><img src="/thumb/${cover.id}" loading="lazy" alt=""></div><h4>${esc(k || "Unknown")}</h4><p>${N(arr.length)} · ${sub(arr)}</p></div>`; }).join("")}</div>`);
  el.insertAdjacentHTML("beforeend", `<p class="muted small" style="margin-top:28px">Place names from <a href="https://www.geonames.org/" target="_blank" rel="noopener" style="color:var(--tx2)">GeoNames</a> (CC BY 4.0).</p>`);
  const open = c => go({ v: "places", p: sel.concat([groups[+c.dataset.i][0]]), up: true });
  $$(".acard[data-i]", el).forEach(c => { c.onclick = () => open(c); c.onkeydown = e => { if (e.key === "Enter") open(c); }; });
}

/* ───────── modals & folder picker ───────── */
const MODALS = [];
function modal(html, { wide } = {}) {

  ov.addEventListener("click", e => { if (e.target.closest("[data-close]")) closeModal(ov); });
  document.body.appendChild(ov); MODALS.push(ov); return ov;
}
function closeModal(ov) { if (!ov.isConnected) return; ov.remove(); MODALS.splice(MODALS.indexOf(ov), 1); ov._onclose && ov._onclose(); }
function pickFolder(title, start) {

    const ov = modal(`<div class="mbody2"><h2>${esc(title)}</h2>
      <div class="fpath"><input id="fp" class="pathin" spellcheck="false" title="You can type or paste a path and press Enter"><button class="btn sm" id="up">↑ Up</button></div>

/* ───────── background job progress ───────── */
let lastJob = null, pollT;
document.addEventListener("visibilitychange", () => { if (!document.hidden) kickJob(); });
function kickJob() { clearTimeout(pollT); setTimeout(pollJob, 250); }
async function pollJob() {
  clearTimeout(pollT);
  let j; try { j = await get("/api/job"); } catch { pollT = setTimeout(pollJob, 3000); return; }
  renderPill(j);
  if (lastJob && j.id && (lastJob.id !== j.id || lastJob.running) && !j.running && j.status) onJobDone(j);
  if (j.running && j.kind === "scan" && j.phase === "processing" && S.all.length < 60 && j.done - (S._rel || 0) >= 80) { S._rel = j.done; load(); }
  if (j.running && j.phase === "tagging" && S.view === "things" && j.done - (S._trel || 0) >= Math.max(200, j.total / 10)) { S._trel = j.done; load(); }
  if (j.running && (j.phase === "tagging" || j.phase === "installing") && S.view === "things" && !(S.placeSel || []).length) renderThingsProgress(j);
  lastJob = j;
  pollT = setTimeout(pollJob, document.hidden ? 20000 : j.running ? 1000 : 5000);
}
function renderPill(j) {
  const p = $("#pill"); if (!j.running) { p.hidden = true; return; }
  p.hidden = false;
  let t = j.label + "…", frac = null;
  if (j.kind === "scan" || j.kind === "remove") {
    if (j.phase === "finding") t = `Looking for photos… ${N(j.found)} found`;
    else if (j.phase === "processing" && j.total) { t = `Reading ${N(j.done)} of ${N(j.total)}${j.eta && j.done > 30 ? ` · ~${fmtEta(j.eta)} left` : ""}`; frac = j.done / j.total; }
    else if (j.phase === "finishing") t = "Finding duplicates, Live Photos & albums…";
  } else if (j.total) { t = `${j.phase === "zipping" ? "Packing .zip" : j.label} · ${N(j.done)} / ${N(j.total)}`; frac = j.done / j.total; }
  if (j.phase === "tagging" && j.total) { t = `Recognising photos · ${N(j.done)} / ${N(j.total)}`; frac = j.done / j.total; }
  else if (j.phase === "installing") t = "Turning on smart tags…";
  $(".pt", p).textContent = t;
  $(".bar", p).style.width = frac == null ? "0" : (100 * frac).toFixed(1) + "%";
  document.documentElement.style.setProperty("--hh", hdrH() + "px");
}
$("#pillStop").onclick = () => post("/api/job/cancel");
function onJobDone(j) {
  if (j.status === "error") return toast("Something went wrong: " + esc(j.error), [], { err: true, ms: 12000 });
  if (j.status === "cancelled") { toast("Stopped. You can pick up where it left off any time."); if (j.kind === "scan") load(); return; }
  const r = j.result || {};
  if (j.kind === "scan") {
    load(); smartSt = null;
    if (r.smart_error) toast("Smart tags couldn’t run: " + esc(r.smart_error), [], { err: true, ms: 12000 });
    const miss = (j.missing || []).length;
    toast(`<b>Your timeline is up to date.</b><br>${N(r.shown)} photos &amp; videos${r.exact + r.similar ? ` · ${N(r.exact + r.similar)} duplicates hidden` : ""}${r.trips ? ` · ${N(r.trips)} trips` : ""}${r.albums ? ` · ${N(r.albums)} Google albums` : ""}${miss ? `<br><span class="muted">${miss} place(s) not connected right now were skipped.</span>` : ""}`);
  } else if (j.kind === "remove") { load(); toast("Removed."); }
  else if (j.kind === "smart") { load(); smartSt = null; toast(`<b>Smart tags are on.</b><br>${N(r.smart?.tagged)} photos recognised. Try searching “mountains” or open Things.`, [["Open Things", () => go({ v: "things" })]]); }
  else if (j.kind === "copy") toast(`Copied ${N(r.copied)} files${r.missing ? ` (${r.missing} skipped — their drive isn’t connected)` : ""}.`, [["Show folder", () => reveal({ path: r.dest })]]);
  else if (j.kind === "export") toast(`<b>Your album is ready to send.</b><br>${esc(r.zip ? r.zip.split(/[\\/]/).pop() : "")} ${r.zip_size ? "· " + fmtBytes(r.zip_size) : ""}`,
    [["Show the .zip", () => reveal({ path: r.zip || r.folder })], ["Open the album page", () => reveal({ path: r.folder })]]);
}
